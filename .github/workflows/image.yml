name: Image

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write
  actions: write

jobs:
  image:
    name: image built in CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          provenance: false
          sbom: false
          tags: |
            ghcr.io/ortix008/xv-aisle-store:${{ github.sha }}
            ghcr.io/ortix008/xv-aisle-store:main
          labels: |
            org.opencontainers.image.source=https://github.com/Ortix008/XV-AIsle
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            DEPLOYED_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
